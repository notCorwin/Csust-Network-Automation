name: Autobuild macOS Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: autobuild
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build and test
        run: |
          bash -n build.sh install.sh
          APP_REVISION="$GITHUB_SHA" bash build.sh

      - name: Package app asset
        run: |
          tar -cf NetworkAuto.app.tar -C target NetworkAuto.app

      - name: Verify package
        run: |
          test -f "target/NetworkAuto.app/Contents/MacOS/NetworkAuto"
          test -x "target/NetworkAuto.app/Contents/MacOS/NetworkAuto"
          test -f "target/NetworkAuto.app/Contents/Info.plist"
          test -f "target/NetworkAuto.app/Contents/Resources/NetworkAuto.icns"
          test -f NetworkAuto.app.tar
          tar -tf NetworkAuto.app.tar | grep -qx "NetworkAuto.app/Contents/MacOS/NetworkAuto"

      - name: Replace autobuild Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="$GITHUB_SHA"
          if release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id' 2>/dev/null)"; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$COMMIT_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$COMMIT_SHA"
          fi

          gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "autobuild" --latest --notes "自动构建自提交 $COMMIT_SHA。"

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$tag_sha" == "$COMMIT_SHA" ]]

          curl --fail --silent --show-error -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=NetworkAuto.app.tar&label=NetworkAuto.app" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/x-tar" --data-binary @NetworkAuto.app.tar

          asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '[.[] | select(.name == "NetworkAuto.app.tar" and .label == "NetworkAuto.app")] | length')"
          [[ "$asset_count" == "1" ]]

          asset_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '[.[] | select(.name == "NetworkAuto.app.tar" and .label == "NetworkAuto.app")] | .[0].digest')"
          [[ "$asset_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
